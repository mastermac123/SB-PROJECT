# One-click deploy on Render (https://render.com): New → Blueprint → pick this repo.
services:
  - type: web
    name: ridesync
    runtime: docker
    plan: starter
    healthCheckPath: /api/config
    disk:
      name: ridesync-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: ALLOWED_EMAIL_DOMAIN
        value: vit.edu.in
      - key: PUBLIC_URL
        sync: false
      - key: MICROSOFT_CLIENT_ID
        sync: false
      - key: MICROSOFT_CLIENT_SECRET
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: MAPTILER_KEY
        sync: false
      - key: ORS_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
