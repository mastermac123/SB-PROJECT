name: Android app

# Builds the RideSync Flutter app (mobile/) into an Android APK on every push to main,
# or by hand from the Actions tab. The APK is attached to the "Android app (latest)"
# release so it can be downloaded straight to a phone.
#
# Optional repository variable RIDESYNC_SERVER_URL (Settings → Secrets and variables →
# Actions → Variables): the online server address to build into the app. Without it, the
# app asks for a server link on first launch (e.g. the share.bat link from a laptop).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-app
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true

      - name: Install packages
        run: flutter pub get

      - name: Check code
        run: flutter analyze && flutter test

      - name: Build APK
        run: flutter build apk --release --dart-define=RIDESYNC_SERVER_URL=${{ vars.RIDESYNC_SERVER_URL }}

      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk RideSync.apk
          gh release delete app-latest --yes --cleanup-tag || true
          gh release create app-latest RideSync.apk \
            --target "${GITHUB_SHA}" \
            --title "Android app (latest)" \
            --prerelease \
            --notes "RideSync for Android (Flutter), built from commit ${GITHUB_SHA::7}. On your phone: download RideSync.apk, open it, and allow installing from this source when asked."

      - uses: actions/upload-artifact@v4
        with:
          name: RideSync-android
          path: mobile/RideSync.apk
